# Builds + publishes the Windows installer whenever you push a tag like v1.0.0
name: Release
on:
  push:
    tags: ['v*']
# The built-in GITHUB_TOKEN is read-only by default; publishing needs to create the release.
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 } # Electron 44 needs Node >= 22.12
      - run: npm ci

      # Bundle ffmpeg so video and audio conversions work out of the box.
      - name: Download ffmpeg into bin/
        shell: bash
        run: |
          set -e
          mkdir -p bin
          curl -fsSL -o ffmpeg.zip https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d ffmpeg-tmp
          cp ffmpeg-tmp/*/bin/ffmpeg.exe ffmpeg-tmp/*/bin/ffprobe.exe bin/
          ./bin/ffmpeg.exe -hide_banner -version | head -1
          rm -rf ffmpeg.zip ffmpeg-tmp
          ls -la bin

      # electron-builder uploads the installer, latest.yml and the blockmap in
      # parallel; when no release exists yet, each upload can create its own
      # release for the same tag. Create one draft up front so they all land
      # in it, and publish it only once everything is uploaded.
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "UniFiles Converter $GITHUB_REF_NAME" --notes-file .github/release-notes.md --verify-tag
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | join(" ")')
          echo "Uploaded: $assets"
          # Never publish a release the updater can't use.
          case " $assets " in *" latest.yml "*) ;; *) echo "::error::latest.yml was not uploaded"; exit 1;; esac
          case " $assets " in *".exe "*) ;; *) echo "::error::the installer was not uploaded"; exit 1;; esac
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
